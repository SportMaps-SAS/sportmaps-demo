name: 🚀 CI/CD Pipeline — SportMaps

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

# Cancela runs anteriores del mismo branch para ahorrar minutos
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WORKING_DIR: ./frontend

# =============================================================================
# JOB 1: Quality Gates (TypeScript + Lint + Build)
# =============================================================================
jobs:
  quality:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v7

      - name: ⚙️ Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🗂️ Migraciones — ledger versionado (versión única, orden, inmutabilidad)
        run: node scripts/migrations.mjs check
        working-directory: .

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔷 TypeScript — verificar tipos
        # OJO con el `-p`: `frontend/tsconfig.json` es un config de solucion
        # (`"files": []` + `references`), asi que `npx tsc --noEmit` a secas revisa
        # CERO archivos y sale 0. Este gate estuvo verde mientras se acumulaban
        # 275 errores de tipos, y por ahi se desplegaron seis ReferenceError el
        # 2026-08-17 (ver INF-8). Hay que apuntar a cada proyecto referenciado.
        run: npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.node.json
        # Gate duro: si falla hay errores de tipos. No se puede deployar.

      - name: 🧹 ESLint — reporte informativo
        # continue-on-error: true mientras se limpian los errores preexistentes.
        # TODO: cambiar a continue-on-error: false cuando el codebase esté limpio.
        # Estado actual: ~462 problemas heredados (no relacionados con el MVP).
        # Solo revisamos src/ — excluimos node_modules, dist, y archivos generados.
        run: npx eslint src --ext .ts,.tsx || echo "⚠️ ESLint encontró problemas (ver annotations). No bloquea el CI por ahora."
        continue-on-error: true

      - name: 🏗️ Build de verificación
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY_STAGING }}
          VITE_WOMPI_PUBLIC_KEY: ${{ secrets.VITE_WOMPI_PUBLIC_KEY || 'pub_stagtest_placeholder' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: staging

      - name: 📊 Verificar tamaño del bundle
        run: |
          # Verificamos que el bundle inicial sea < 300KB (gzip)
          BUNDLE_SIZE=$(find dist/assets -name '*.js' -not -name '*.map' | xargs du -sk | awk '{sum += $1} END {print sum}')
          echo "Bundle size: ${BUNDLE_SIZE}KB"
          if [ "$BUNDLE_SIZE" -gt 1500 ]; then
            echo "⚠️ Bundle > 1.5MB sin comprimir. Revisar imports innecesarios."
          fi

# =============================================================================
# JOB 2: Unit Tests (Vitest)
# =============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 🧪 Ejecutar tests unitarios
        run: npx vitest run --reporter=verbose --coverage
        env:
          VITE_SUPABASE_URL: 'https://mock.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'mock-key-for-tests'

      - name: 📈 Subir coverage a Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ env.WORKING_DIR }}/coverage
          fail_ci_if_error: false

# =============================================================================
# JOB 2b: BFF (servidor + bot de WhatsApp) — tipos y tests
# Informativo al arrancar (continue-on-error): hasta 2026-10-09 el CI solo
# probaba el frontend. Cuando quede verde estable, quitar continue-on-error.
# =============================================================================
  bff:
    name: 🛰️ BFF — tipos y tests
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./bff
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bff/package-lock.json
      - run: npm ci
      - name: 🔷 TypeScript (bff)
        run: node node_modules/typescript/bin/tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: 🧪 Tests (bff)
        if: always()
        run: npx vitest run
        env:
          SUPABASE_URL: 'https://mock.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: 'mock-service-role-key'
          SUPABASE_ANON_KEY: 'mock-anon-key'

# =============================================================================
# JOB 3: E2E Tests (Playwright) — Solo en PRs a main/develop
# =============================================================================
  e2e:
    name: 🎭 E2E Tests (Golden Path)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    # Los PRs de Dependabot NO reciben los secretos del repo: sin STAGING_URL ni
    # credenciales, Playwright corría contra nada y se quedaba 1 h 24 min fallando
    # con «Failed to fetch» (2026-10-26, PR #35). Para ellos se salta.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    # Sin tope, GitHub deja un job colgado hasta 6 h gastando minutos de Actions.
    timeout-minutes: 20

    steps:
      - name: 🔐 ¿Hay ambiente de staging?
        id: staging
        run: |
          if [ -z "${{ vars.STAGING_URL || secrets.STAGING_URL }}" ]; then
            echo "Sin STAGING_URL: el E2E se salta (correría contra nada)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.staging.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.staging.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        if: steps.staging.outputs.ok == 'true'
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: 🎭 Instalar Playwright browsers
        if: steps.staging.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.WORKING_DIR }}

      - name: 🎭 Ejecutar E2E — Golden Path
        if: steps.staging.outputs.ok == 'true'
        run: npx playwright test --project=chromium
        working-directory: ${{ env.WORKING_DIR }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL || secrets.STAGING_URL }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: 📸 Subir screenshots de errores
        uses: actions/upload-artifact@v7
        if: failure() && steps.staging.outputs.ok == 'true'
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

# =============================================================================
# JOB 4: Deploy (Manejado nativamente por Vercel)
# =============================================================================
# Los despliegues ahora son manejados directamente por la integración de Vercel en GitHub.
# Vercel construirá automáticamente los commits en las ramas configuradas.
# Ver `vercel.json` y `vercel-ignore-build.sh` para reglas lógicas de despliegues automatizados.
